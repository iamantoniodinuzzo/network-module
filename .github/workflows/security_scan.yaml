name: 🔒 Security Scan

on:
  schedule:
    # Run security scan first Monday of every month at 9 AM UTC
    - cron: '0 9 1-7 * 1'
  workflow_dispatch: # Allow manual trigger

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Check dependency tree
        run: flutter pub deps

      - name: 📋 Check for outdated dependencies
        run: flutter pub outdated

      - name: 🔒 Install pana for pub.dev analysis
        run: dart pub global activate pana

      - name: 📊 Run pana analysis
        run: dart pub global run pana --json > pana_report.json
        continue-on-error: true

      - name: 📤 Upload pana report
        uses: actions/upload-artifact@v4
        with:
          name: pana-security-report
          path: pana_report.json
          retention-days: 30

      - name: 🔍 Analyze pana results
        run: |
          if [ -f pana_report.json ]; then
            echo "📊 Pana Analysis Results:"
            cat pana_report.json | jq '.scores' || echo "Could not parse JSON"
            
            # Check for critical issues
            SCORE=$(cat pana_report.json | jq -r '.scores.grantedPoints // 0')
            MAX_SCORE=$(cat pana_report.json | jq -r '.scores.maxPoints // 130')
            
            echo "Score: $SCORE/$MAX_SCORE"
            
            if [ "$SCORE" -lt 100 ]; then
              echo "⚠️ Package score is below 100. Review needed."
              cat pana_report.json | jq '.suggestions' || echo "No suggestions available"
            else
              echo "✅ Package score is acceptable ($SCORE/$MAX_SCORE)"
            fi
          else
            echo "❌ Pana report not generated"
          fi

  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  security-summary:
    name: 📋 Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: always()

    steps:
      - name: 📋 Create security summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.security-audit.result }}" == "success" ]; then
            echo "✅ **Security audit completed successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Actions taken:" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Dependency tree analyzed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Outdated dependencies checked" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ pub.dev analysis completed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Security report generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security audit failed or had issues**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the security audit logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Review any security recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Update outdated dependencies if needed" >> $GITHUB_STEP_SUMMARY
          echo "- Check pana report artifact for detailed analysis" >> $GITHUB_STEP_SUMMARY 