name: 📦 Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allow manual trigger

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  publish:
    name: 📦 Publish to pub.dev & GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run tests
        run: flutter test --reporter=expanded

      - name: 📋 Validate package
        run: dart pub publish --dry-run

      - name: 📊 Get version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: 🔧 Setup pub credentials
        run: |
          if [ -z "${{ secrets.PUB_DEV_CREDENTIALS }}" ]; then
            echo "❌ PUB_DEV_CREDENTIALS secret is not set!"
            echo "Please follow the guide in PUB_CREDENTIALS_SETUP.md"
            exit 1
          fi
          mkdir -p ~/.pub-cache
          echo '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.pub-cache/credentials.json
          echo "✅ Pub credentials configured"

      - name: 🚀 Publish to pub.dev
        timeout-minutes: 5
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          echo "🚀 Publishing version ${{ steps.version.outputs.version }}..."
          
          # Verify credentials are working
          if ! dart pub deps > /dev/null 2>&1; then
            echo "❌ Dart pub not working correctly"
            exit 1
          fi
          
          # Try to publish with various approaches
          echo "📋 Attempting to publish package..."
          
          # Method 1: Direct publish with force (should work if credentials are correct)
          if timeout 120s dart pub publish --force; then
            echo "✅ Published successfully with --force!"
          else
            echo "❌ Direct publish failed, trying alternative method..."
            
            # Method 2: Use expect to handle any remaining prompts
            sudo apt-get update && sudo apt-get install -y expect
            
            expect << 'EOF'
            set timeout 120
            spawn dart pub publish --force
            expect {
              "Do you want to publish" {
                send "y\r"
                exp_continue
              }
              "Successfully uploaded package" {
                exit 0
              }
              "Pub needs your authorization" {
                puts "❌ Authorization still required"
                exit 1
              }
              timeout {
                puts "❌ Timeout during publish"
                exit 1
              }
              eof {
                exit 0
              }
            }
          EOF
          fi
          
          echo "✅ Package published to pub.dev!"

      - name: 📋 Extract changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "## Release $VERSION" > release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 