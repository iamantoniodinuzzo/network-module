name: 📦 Publish to pub.dev

on:
  push:
    tags:
      - 'v*.*.*' # Trigger solo su tag semantici (v1.0.0, v2.1.3, etc.)
  workflow_dispatch: # Permette esecuzione manuale
    inputs:
      dry_run:
        description: 'Run dry-run only (no actual publishing)'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  # Pre-check: Verifica che tutto sia pronto per la pubblicazione
  pre_publish_checks:
    name: 🔍 Pre-publish Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze --fatal-infos

      - name: 🧪 Run all tests
        run: flutter test --reporter=expanded

      - name: 📋 Validate package for pub.dev
        run: dart pub publish --dry-run

      - name: 🏗️ Build example app
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - name: 📊 Get package version
        id: get_version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $VERSION"

      - name: 🔍 Check if prerelease
        id: check_prerelease
        run: |
          if [[ "${{ steps.get_version.outputs.version }}" =~ -.*$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "🚧 This is a prerelease version"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ This is a stable release"
          fi

      - name: 📋 Verify CHANGELOG.md updated
        run: |
          if ! grep -q "${{ steps.get_version.outputs.version }}" CHANGELOG.md; then
            echo "❌ CHANGELOG.md does not contain version ${{ steps.get_version.outputs.version }}"
            echo "Please update CHANGELOG.md with the new version changes"
            exit 1
          fi
          echo "✅ CHANGELOG.md contains version ${{ steps.get_version.outputs.version }}"

  # Pubblicazione effettiva
  publish:
    name: 🚀 Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre_publish_checks

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔧 Setup pub credentials
        run: |
          mkdir -p ~/.pub-cache
          echo '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.pub-cache/credentials.json

      - name: 🧪 Final dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🧪 Running final dry-run validation..."
          dart pub publish --dry-run
          echo "✅ Dry-run completed successfully!"

      - name: 🚀 Publish to pub.dev
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "🚀 Publishing version ${{ needs.pre_publish_checks.outputs.version }} to pub.dev..."
          dart pub publish --force
          echo "✅ Package published successfully!"

      - name: 🎉 Publish success notification
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          echo "🎉 Successfully published network_module v${{ needs.pre_publish_checks.outputs.version }} to pub.dev!"
          echo "📦 Package URL: https://pub.dev/packages/network_module"
          echo "📋 Version URL: https://pub.dev/packages/network_module/versions/${{ needs.pre_publish_checks.outputs.version }}"

  # Creazione GitHub Release
  create_github_release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pre_publish_checks, publish]
    if: success() && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.pre_publish_checks.outputs.version }}"
          # Estrai la sezione del changelog per questa versione
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          # Se il file è vuoto, crea note generiche
          if [ ! -s release_notes.md ]; then
            echo "## Release $VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for detailed changes." >> release_notes.md
          fi

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.pre_publish_checks.outputs.version }}
          name: Release v${{ needs.pre_publish_checks.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.pre_publish_checks.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notifica di successo
  notify_success:
    name: 📢 Success Notification
    runs-on: ubuntu-latest
    needs: [pre_publish_checks, publish, create_github_release]
    if: success()

    steps:
      - name: 🎊 Create success summary
        run: |
          echo "## 🎉 Publication Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** network_module" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.pre_publish_checks.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ needs.pre_publish_checks.outputs.is_prerelease == 'true' && 'Prerelease' || 'Stable Release' }}" >> $GITHUB_STEP_SUMMARY
          echo "**pub.dev URL:** https://pub.dev/packages/network_module" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ needs.pre_publish_checks.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package is now available on pub.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️ GitHub Release created with changelog" >> $GITHUB_STEP_SUMMARY
          echo "- 📖 Documentation will be generated automatically" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Update your projects to use the new version" >> $GITHUB_STEP_SUMMARY 