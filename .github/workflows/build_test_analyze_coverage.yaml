name: Build, Test, Analyze & Report Coverage

on:
  push:
    branches:
      - main       # Esegui su push a main (post-merge di release/hotfix)
      - develop    # Esegui su push a develop (post-merge di feature/release/hotfix)
      # Opzionale, ma consigliato se si lavora direttamente su questi branch:
      # - 'release/*'
      # - 'hotfix/*'
  pull_request:
    # Esegui su PR che puntano ai branch principali di integrazione
    branches:
      - main       # Fondamentale per PR da release/* e hotfix/*
      - develop    # Fondamentale per PR da feature/*, release/*, hotfix/*
      # Opzionale: se fai PR verso release/hotfix branches
      # - 'release/*'
      # - 'hotfix/*'

jobs:
  build_test_analyze_coverage: 
    name: Build, Test, Analyze & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter SDK
      uses: flutter-actions/setup-flutter@v1
      with:
        channel: 'stable'
        version: '3.29.0' 
        cache: true

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.FLUTTER_ROOT }}/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Install dependencies
      run: flutter pub get

    - name: Check Formatting
      run: flutter format --output=none --set-exit-if-changed .

    - name: Analyze project code
      run: flutter analyze

    - name: Run tests and collect coverage
      run: flutter test --coverage

    # Opzionale: Processare lcov.info se necessario (es. rimuovere file generati)
    # - name: Clean coverage report (example)
    #   run: |
    #     sudo apt-get update && sudo apt-get install -y lcov # Installa lcov se non presente
    #     lcov --remove coverage/lcov.info 'lib/**.g.dart' 'lib/**.freezed.dart' -o coverage/lcov_cleaned.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4 # O la versione che preferisci (v4 è stabile)
      # Usa `with` per fornire opzioni all'azione
      with:
          token: ${{ secrets.CODECOV_TOKEN }} # Obbligatorio per repo privati, buona pratica per pubblici
          files: coverage/lcov.info # O coverage/lcov_cleaned.info se l'hai processato
          fail_ci_if_error: true # Fa fallire il workflow se l'upload non va a buon fine
          verbose: true # Utile per il debug in caso di problemi con l'upload

    # - name: Check if ready for publishing (Dry Run) # Passo opzionale
    #   run: flutter pub publish --dry-run