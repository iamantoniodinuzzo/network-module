name: Create Package GitHub Release

# Trigger: Esegui quando viene creato un tag Git che inizia con 'v'
# O quando viene lanciato manualmente.
on:
  push:
    tags:
      - 'v*.*.*' # Pattern per i tag di versione (SemVer)
  workflow_dispatch: # Permette l'avvio manuale

# Permessi necessari per creare la GitHub Release
permissions:
  contents: write # Necessario per l'azione action-gh-release

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del codice al tag specifico
      # Necessario se vuoi generare note di rilascio basate sulla history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Recupera tutta la history per permettere la generazione del changelog tra tag
          fetch-depth: 0

      # 2. (ALTAMENTE RACCOMANDATO) Genera Note di Rilascio Automaticamente
      # Usa un'azione che supporti Conventional Commits (se li usi)
      # o genera un changelog basato sui messaggi di commit tra i tag.
      # Esempio con conventional-changelog-action:
      - name: Generate Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5 # Controlla l'ultima versione
        with:
          # GITHUB_TOKEN è necessario per recuperare info su commit/PR/issues
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Output del file changelog (puoi scegliere il nome)
          output-file: "CHANGELOG_TEMP.md"
          # Specifica il tag corrente per generare solo le note per questa release
          tag-prefix: "v" # Se i tuoi tag iniziano con 'v'

      # ALTERNATIVA più semplice (se non usi Conventional Commits):
      # Potresti creare uno script semplice che usa `git log`
      # - name: Generate Basic Release Notes
      #   id: generate_notes
      #   run: |
      #     echo "## Release Notes for ${{ github.ref_name }}" > release_notes.md
      #     # Stampa i subject dei commit tra il tag precedente e quello attuale
      #     git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s (%h)" >> release_notes.md
      #     echo "::set-output name=notes_path::release_notes.md"

      # 3. Crea la Release su GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # Controlla l'ultima versione
        # Assicurati che questo step venga eseguito solo se il trigger è un tag
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Usa il contenuto del file changelog generato come corpo della release
          body_path: ${{ steps.changelog.outputs.changelog_path || 'CHANGELOG_TEMP.md' }} # Usa l'output dell'azione changelog
          # ALTERNATIVA (se usi l'alternativa git log):
          # body_path: ${{ steps.generate_notes.outputs.notes_path }}
          # O scrivi note statiche/manuali qui:
          # body: "Release version ${{ github.ref_name }}. Consultare il CHANGELOG.md completo per i dettagli."

          tag_name: ${{ github.ref_name }} # Usa il tag che ha triggerato il workflow
          name: Release ${{ github.ref_name }} # Nome della release (es. Release v1.0.0)
          # draft: false # Pubblica direttamente (impostalo a true se vuoi revisionare prima)
          # prerelease: contains(github.ref_name, '-') # Marca automaticamente come pre-release se il tag contiene '-' (es. v1.0.0-beta.1)

          # !!! Non serve la sezione 'files:' se devi solo rilasciare il codice sorgente.
          # GitHub aggiunge automaticamente link ai tarball/zip del codice sorgente
          # per il tag specificato. Se avessi artefatti specifici del pacchetto da
          # allegare (es. documentazione generata), li aggiungeresti qui.
          # files: |
          #   path/to/your/package/artifact.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token fornito automaticamente da GitHub Actions